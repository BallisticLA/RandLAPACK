name: core-linux
on:
  pull_request:
    branches-ignore:
      - cqrrp-gpu-benchmarking
  workflow_dispatch:
  # Only main. A branch with an open pull request is already covered by the
  # pull_request event above, and firing on both ran every job twice per
  # commit -- same SHA, same result.
  push:
    branches:
      - main

# One run per ref at a time. Pushing a fix used to leave the superseded run
# going to completion. Superseding is only safe for pull requests: on main we
# want every commit validated, not just the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# BLAS++ and LAPACK++ are fetched at the commits in
# installers/dependency-pins.env, and the dependency cache key carries both
# hashes, so changing a pin rebuilds them. Random123 still tracks its default
# branch; bump the -v suffix in the cache key to refresh it.
#
# Cache paths start from runner.workspace, the checkout's parent:
# actions/cache refuses to save a path containing ".." ("Invalid pattern ...
# Relative pathing '.' and '..' is not allowed"), so the old
# github.workspace/../ spelling restored caches that were never saved.
#
# The RandBLAS submodule's own test suite is disabled (-DBUILD_TESTS=OFF):
# the pinned commit is already tested by RandBLAS's CI, and rebuilding and
# rerunning its roughly 480 tests here roughly doubled the job time.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: submodule update
        run: |
          git submodule update --init --recursive

      - name: configure OS
        run: |
          # os level stuff
          echo `pwd`
          echo `ls`
          set -x
          export DEBIAN_FRONTEND="noninteractive"
          export TZ="America/Los_Angeles"
          sudo apt-get update -qq
          sudo apt-get install -qq -y git-core gcc g++ gfortran cmake subversion automake m4 libgtest-dev libopenblas-openmp-dev
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
          | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt update

      - name: read dependency pins
        id: pins
        run: bash .github/scripts/dependency-pins.sh export installers/dependency-pins.env

      - name: cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.workspace }}/blaspp-install
            ${{ runner.workspace }}/lapackpp-install
            ${{ runner.workspace }}/Random123-install
          key: core-deps-${{ runner.os }}-blaspp-${{ steps.pins.outputs.BLASPP_REF }}-lapackpp-${{ steps.pins.outputs.LAPACKPP_REF }}-v1

      - name: install BLAS++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          BLASPP_URL: ${{ steps.pins.outputs.BLASPP_URL }}
          BLASPP_REF: ${{ steps.pins.outputs.BLASPP_REF }}
        run: |
          cd ..
          bash "$GITHUB_WORKSPACE/.github/scripts/dependency-pins.sh" fetch "$BLASPP_URL" "$BLASPP_REF" blaspp
          mkdir blaspp-build
          cd blaspp-build
          pwd
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`pwd`/../blaspp-install -Dbuild_tests=OFF ../blaspp
          make -j$(nproc) install

      - name: install Random123
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/DEShawResearch/Random123.git
          cd Random123/
          make prefix=`pwd`/../Random123-install install-include

      - name: install LAPACK++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          LAPACKPP_URL: ${{ steps.pins.outputs.LAPACKPP_URL }}
          LAPACKPP_REF: ${{ steps.pins.outputs.LAPACKPP_REF }}
        run: |
          cd ..
          bash "$GITHUB_WORKSPACE/.github/scripts/dependency-pins.sh" fetch "$LAPACKPP_URL" "$LAPACKPP_REF" lapackpp
          mkdir lapackpp-build
          cd lapackpp-build
          cmake -DCMAKE_BUILD_TYPE=Release \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../lapackpp-install \
              -Dbuild_tests=OFF \
              `pwd`/../lapackpp
          make -j$(nproc) install

      # Tests run in parallel, as `ctest -j` runs them locally: each test case
      # is its own process, so cases that share state (a file, a directory)
      # fail here instead of only on a developer's machine. Two OpenMP threads
      # per test keep the runner from oversubscribing.
      - name: build and test RandLAPACK (Release)
        env:
          OMP_NUM_THREADS: 2
        run: |
          cd ..
          mkdir RandLAPACK-build
          cd RandLAPACK-build
          cmake -DCMAKE_BUILD_TYPE=Release \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -Dlapackpp_DIR=`pwd`/../lapackpp-install/lib/cmake/lapackpp \
              -DRandom123_DIR=`pwd`/../Random123-install/include/ \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../RandLAPACK-install \
              -DBUILD_TESTS=OFF \
              `pwd`/../RandLAPACK
          make -j$(nproc)
          make -j$(nproc) install
          ctest --output-on-failure -j "$(nproc)"

      # The extras suite takes about a second, so it also repeats each case
      # under heavier parallelism, which makes a shared-state race show up
      # reliably rather than occasionally.
      - name: build and test extras
        env:
          OMP_NUM_THREADS: 1
        run: |
          cd ..
          mkdir extras-build
          cd extras-build
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DRandLAPACK_DIR=`pwd`/../RandLAPACK-install/lib/cmake/RandLAPACK \
            -Dlapackpp_DIR=`pwd`/../lapackpp-install/lib/cmake/lapackpp \
            -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
            -DRandom123_DIR=`pwd`/../Random123-install/include/ \
            ../RandLAPACK/extras
          make -j$(nproc)
          ctest --output-on-failure -j 8 --repeat until-fail:5

      - name: build benchmarks
        run: |
          cd ..
          mkdir benchmark-build
          cd benchmark-build
          cmake \
            -DRandLAPACK_DIR=`pwd`/../RandLAPACK-install/lib/cmake/RandLAPACK \
            ../RandLAPACK/benchmark
          make -j$(nproc)

  # Runs in parallel with the Release job instead of doubling its wall time.
  build-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: submodule update
        run: |
          git submodule update --init --recursive

      - name: configure OS
        run: |
          set -x
          export DEBIAN_FRONTEND="noninteractive"
          sudo apt-get update -qq
          sudo apt-get install -qq -y git-core gcc g++ gfortran cmake libgtest-dev libopenblas-openmp-dev

      - name: read dependency pins
        id: pins
        run: bash .github/scripts/dependency-pins.sh export installers/dependency-pins.env

      - name: cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.workspace }}/blaspp-install
            ${{ runner.workspace }}/lapackpp-install
            ${{ runner.workspace }}/Random123-install
          key: core-deps-${{ runner.os }}-blaspp-${{ steps.pins.outputs.BLASPP_REF }}-lapackpp-${{ steps.pins.outputs.LAPACKPP_REF }}-v1

      - name: install BLAS++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          BLASPP_URL: ${{ steps.pins.outputs.BLASPP_URL }}
          BLASPP_REF: ${{ steps.pins.outputs.BLASPP_REF }}
        run: |
          cd ..
          bash "$GITHUB_WORKSPACE/.github/scripts/dependency-pins.sh" fetch "$BLASPP_URL" "$BLASPP_REF" blaspp
          mkdir blaspp-build
          cd blaspp-build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`pwd`/../blaspp-install -Dbuild_tests=OFF ../blaspp
          make -j$(nproc) install

      - name: install Random123
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/DEShawResearch/Random123.git
          cd Random123/
          make prefix=`pwd`/../Random123-install install-include

      - name: install LAPACK++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          LAPACKPP_URL: ${{ steps.pins.outputs.LAPACKPP_URL }}
          LAPACKPP_REF: ${{ steps.pins.outputs.LAPACKPP_REF }}
        run: |
          cd ..
          bash "$GITHUB_WORKSPACE/.github/scripts/dependency-pins.sh" fetch "$LAPACKPP_URL" "$LAPACKPP_REF" lapackpp
          mkdir lapackpp-build
          cd lapackpp-build
          cmake -DCMAKE_BUILD_TYPE=Release \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../lapackpp-install \
              -Dbuild_tests=OFF \
              `pwd`/../lapackpp
          make -j$(nproc) install

      - name: build and test RandLAPACK (Debug/asan)
        run: |
          cd ..
          mkdir RandLAPACK-build-asan
          cd RandLAPACK-build-asan
          cmake -DCMAKE_BUILD_TYPE=Debug \
              -DSANITIZE_ADDRESS=ON \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -Dlapackpp_DIR=`pwd`/../lapackpp-install/lib/cmake/lapackpp \
              -DRandom123_DIR=`pwd`/../Random123-install/include/ \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../RandLAPACK-install-asan \
              -DBUILD_TESTS=OFF \
              `pwd`/../RandLAPACK
          make -j$(nproc)
          make -j$(nproc) install
          ctest --output-on-failure
