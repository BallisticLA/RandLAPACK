# Exercises install.sh itself -- the one artifact the core workflows never
# run (they hand-replicate the build recipes instead). Three things are
# verified per OS:
#   1. a fresh clone piped through the installer non-interactively builds
#      and its test suite passes;
#   2. re-running the installer in place succeeds (idempotent re-runs are
#      part of the script's contract);
#   3. the dependency-discovery path (BLASPP_INSTALL_DIR & co.) configures
#      a second project against already-installed dependencies.
# The Windows job runs install.ps1 the same way (fresh + idempotent re-run).
# The Linux/macOS lanes invoke the root install.sh wrapper on purpose: users
# type `bash install.sh`, so CI exercises the wrapper along with the script.
name: install-script
on:
  pull_request:
    branches-ignore:
      - cqrrp-gpu-benchmarking
  workflow_dispatch:
  push:
    branches-ignore:
      - cqrrp-gpu-benchmarking

jobs:
  install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RandLAPACK

      - name: configure OS
        run: |
          export DEBIAN_FRONTEND="noninteractive"
          sudo apt-get update -qq
          sudo apt-get install -qq -y git-core gcc g++ gfortran cmake libgtest-dev libopenblas-openmp-dev

      # blaspp/lapackpp/random123 rarely change; cache their installs keyed
      # per-OS. On a cache hit the discovery env vars are seeded, so the
      # installer's reuse path gets exercised; on a miss the full
      # build-from-source path runs and the installs are copied out for the
      # cache. Bump the -v suffix to force a from-scratch run.
      - name: cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps-install
          key: installer-deps-${{ runner.os }}-v1

      - name: seed discovery variables from cache
        if: steps.deps-cache.outputs.cache-hit == 'true'
        run: |
          echo "BLASPP_INSTALL_DIR=$GITHUB_WORKSPACE/deps-install/blaspp-install" >> "$GITHUB_ENV"
          echo "LAPACKPP_INSTALL_DIR=$GITHUB_WORKSPACE/deps-install/lapackpp-install" >> "$GITHUB_ENV"
          echo "RANDOM123_INSTALL_DIR=$GITHUB_WORKSPACE/deps-install/random123" >> "$GITHUB_ENV"

      - name: keep a pristine clone for the discovery test
        run: cp -a RandLAPACK RandLAPACK-discovery

      - name: run the installer (non-interactive)
        run: bash RandLAPACK/install.sh --yes --no-gpu

      - name: populate the dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps-install
          cp -a RandNLA-project/install/blaspp-install   deps-install/
          cp -a RandNLA-project/install/lapackpp-install deps-install/
          cp -a RandNLA-project/install/random123        deps-install/

      - name: test the installed library
        run: |
          ctest --test-dir RandNLA-project/build/RandLAPACK-build \
                --exclude-regex "^TestABRIK\.ABRIK_catch_instability" \
                --output-on-failure

      - name: re-run the installer in place (idempotency)
        run: bash RandNLA-project/lib/RandLAPACK/install.sh --yes --no-gpu

      - name: install a second project via dependency discovery
        run: |
          BLASPP_INSTALL_DIR="$GITHUB_WORKSPACE/deps-install/blaspp-install" \
          LAPACKPP_INSTALL_DIR="$GITHUB_WORKSPACE/deps-install/lapackpp-install" \
          RANDOM123_INSTALL_DIR="$GITHUB_WORKSPACE/deps-install/random123" \
          bash RandLAPACK-discovery/install.sh --yes --no-gpu \
              --project-dir "$GITHUB_WORKSPACE/RandNLA-project-discovery" \
              | tee discovery.out
          grep -q "reused external install" discovery.out
          test -d RandNLA-project-discovery/build/RandLAPACK-build

  install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RandLAPACK

      - name: configure OS
        run: brew install googletest openblas libomp

      - name: run the installer (non-interactive)
        run: bash RandLAPACK/install.sh --yes --no-gpu

      - name: test the installed library
        run: |
          ctest --test-dir RandNLA-project/build/RandLAPACK-build \
                --exclude-regex "^TestABRIK\.ABRIK_catch_instability" \
                --output-on-failure

      - name: re-run the installer in place (idempotency)
        run: bash RandNLA-project/lib/RandLAPACK/install.sh --yes --no-gpu

  install-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: RandLAPACK
          submodules: recursive

      - name: initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Shares the cached dependency stack with core-windows (same keys,
      # same ..\windows-deps location); install.ps1 then reuses it through
      # -DependencyRoot instead of rebuilding under its project directory.
      - name: setup native Windows dependencies
        uses: ./RandLAPACK/.github/actions/setup-randlapack-deps-windows

      - name: run the installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/RandLAPACK/install/install.ps1" `
            -ProjectDir "$env:GITHUB_WORKSPACE/RandNLA-project" `
            -DependencyRoot "$env:GITHUB_WORKSPACE/../windows-deps"

      - name: re-run the installer in place (idempotency)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/RandLAPACK/install/install.ps1" `
            -ProjectDir "$env:GITHUB_WORKSPACE/RandNLA-project" `
            -DependencyRoot "$env:GITHUB_WORKSPACE/../windows-deps" `
            -SkipTests

  # User-fidelity lane: a plain Visual Studio install has no standalone
  # vcpkg -- only the manifest-only copy bundled with the C++ workload. A
  # classic-mode `vcpkg install` fails there ("this vcpkg distribution does
  # not have a classic mode instance") while staying green on CI runners,
  # which ship a classic-capable C:\vcpkg. This job hides the runner's
  # standalone vcpkg and provisions oneMKL through the bundled copy. The
  # vcpkg-installed tree is deliberately NOT cached so every run exercises
  # the manifest-mode fetch; only the installer download is cached.
  install-windows-vs-vcpkg:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: RandLAPACK
          submodules: recursive

      - name: initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: cache oneMKL installer downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\windows-deps-vsvcpkg\vcpkg-scratch\downloads
          key: windows-vsvcpkg-mkl-downloads-1-${{ hashFiles('RandLAPACK/.github/actions/setup-randlapack-deps-windows/setup.ps1') }}

      - name: cache GoogleTest
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\windows-deps-vsvcpkg\googletest-install
          key: windows-vsvcpkg-googletest-1.17.0-1-${{ hashFiles('RandLAPACK/.github/actions/setup-randlapack-deps-windows/setup.ps1') }}

      - name: cache Random123
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\windows-deps-vsvcpkg\Random123-install
          key: windows-vsvcpkg-random123-1-${{ hashFiles('RandLAPACK/.github/actions/setup-randlapack-deps-windows/setup.ps1') }}

      - name: cache BLAS++
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\windows-deps-vsvcpkg\blaspp-install
          key: windows-vsvcpkg-blaspp-remove-symv-debug-print-ilp64-sequential-1-${{ hashFiles('RandLAPACK/.github/actions/setup-randlapack-deps-windows/setup.ps1') }}

      - name: cache LAPACK++
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\windows-deps-vsvcpkg\lapackpp-install
          key: windows-vsvcpkg-lapackpp-msvc-direct-includes-ilp64-sequential-1-${{ hashFiles('RandLAPACK/.github/actions/setup-randlapack-deps-windows/setup.ps1') }}

      - name: run the installer with the Visual Studio bundled vcpkg
        shell: pwsh
        run: |
          Remove-Item Env:VCPKG_INSTALLATION_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue
          $bundledVcpkg = Join-Path $env:VSINSTALLDIR "VC\vcpkg\vcpkg.exe"
          if (-not (Test-Path $bundledVcpkg)) {
            throw "Runner image has no VS-bundled vcpkg at $bundledVcpkg; this lane needs another way to reproduce a manifest-only vcpkg."
          }
          & "$env:GITHUB_WORKSPACE/RandLAPACK/install/install.ps1" `
            -ProjectDir "$env:GITHUB_WORKSPACE/RandNLA-project" `
            -DependencyRoot "$env:GITHUB_WORKSPACE/../windows-deps-vsvcpkg" `
            -VcpkgExecutable $bundledVcpkg
