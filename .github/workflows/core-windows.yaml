name: core-windows
on:
  pull_request:
    branches-ignore:
      - cqrrp-gpu-benchmarking
  workflow_dispatch:
  push:
    branches-ignore:
      - cqrrp-gpu-benchmarking

jobs:
  # Decision-level test of the architecture guard. Needs no MSVC and no
  # build, so it covers arm64 and arm -- which we cannot build for, and so
  # can never cover with a build leg -- in a few seconds on x64 hardware.
  # Also asserts install.ps1's and setup.ps1's duplicated copies agree.
  windows-guard-logic:
    name: windows-guard-logic
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: architecture guard decision table
        shell: powershell
        run: .\.github\scripts\windows\test-toolchain-guard.ps1

  # Structural gate for the documented *user* path, which the build matrix
  # below cannot cover: it initializes MSVC with an explicit arch: x64 and
  # runs under pwsh, so it has never exercised the shell the install docs
  # tell users to open. That gap is exactly how a 32-bit toolchain reached a
  # collaborator and failed three layers down as "BLAS library not found".
  #
  # These legs assert a *refusal*, so they stop at preflight in seconds and
  # never build a dependency: cheap enough to keep permanently. arch x86 is
  # the real-world case; amd64_arm64 cross-compiles, which yields an
  # ARM64-targeting cl.exe on an ordinary x64 runner and so covers the ARM
  # branch of the guard without ARM hardware.
  windows-toolchain-guards:
    name: windows-guard-${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            expect: targets x86
          - arch: amd64_arm64
            expect: targets arm64
    steps:
      - uses: actions/checkout@v4

      - name: initialize MSVC (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # Windows PowerShell 5.1, not pwsh: this is what a user actually gets,
      # and the launch line is verbatim the one INSTALL_WINDOWS.md prescribes
      # (cmd + -ExecutionPolicy Bypass), so the documented invocation itself
      # stays under test.
      - name: install.ps1 must refuse a ${{ matrix.arch }} toolchain
        shell: powershell
        run: |
          $output = & cmd /c "powershell -ExecutionPolicy Bypass -File .\install\install.ps1 2>&1"
          $exit = $LASTEXITCODE
          $text = $output -join "`n"
          Write-Host $text
          if ($exit -eq 0) {
            throw "install.ps1 succeeded with a ${{ matrix.arch }} toolchain; the architecture guard did not fire."
          }
          if ($text -notmatch '${{ matrix.expect }}') {
            throw "The guard fired, but no '${{ matrix.expect }}' in its output: the wrong check failed."
          }
          Write-Host "OK: refused ${{ matrix.arch }} at preflight, with the expected explanation."

  build-windows:
    name: windows-msvc-${{ matrix.backend }}-${{ matrix.int }}-${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      # Deliberately small matrix (see docs/CI.md): the mkl legs cover the
      # default backend serial + OpenMP; ONE openblas leg covers the non-MKL
      # provisioning and LP64 build. No openblas-openmp (OpenMP x MSVC is
      # backend-orthogonal and already covered) and no Windows ASan lane.
      matrix:
        include:
          - label: serial
            backend: mkl
            int: ilp64
            openmp: false
          - label: openmp
            backend: mkl
            int: ilp64
            openmp: true
          - label: serial
            backend: openblas
            int: lp64
            openmp: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: setup native Windows dependencies
        uses: ./.github/actions/setup-randlapack-deps-windows
        with:
          blas-backend: ${{ matrix.backend }}

      - name: build, install, and test RandLAPACK
        shell: pwsh
        run: |
          $openmp = '${{ matrix.openmp }}' -eq 'true'
          & "$env:GITHUB_WORKSPACE/.github/scripts/windows/run-ci.ps1" `
            -Task Core `
            -WorkRoot "$env:GITHUB_WORKSPACE/../RandLAPACK-windows-ci" `
            -Backend '${{ matrix.backend }}' `
            -OpenMP:$openmp

      # Staged executables must run with NO PATH preparation: this is the
      # regression gate for app-local DLL staging (Windows searches the exe's
      # directory first, so a staged exe needs nothing else).
      - name: run a staged test executable with a stripped PATH
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE/../RandLAPACK-windows-ci/RandLAPACK-build" `
            -Recurse -Filter "RandLAPACK_tests.exe" | Select-Object -First 1
          if (-not $exe) { throw "RandLAPACK_tests.exe not found in the build tree." }
          $env:PATH = "C:\Windows\System32;C:\Windows"
          # Starting the process at all forces the loader to resolve every
          # statically imported DLL (BLAS++, LAPACK++, the BLAS backend) from
          # the staged copies; listing tests proves it end to end. Capture
          # the full output first -- an early-terminating pipeline (e.g.
          # Select-Object -First) would kill the process before it exits and
          # leave $LASTEXITCODE unset.
          $output = & $exe.FullName --gtest_list_tests 2>&1
          $exit = $LASTEXITCODE
          $output | Select-Object -First 5 | Out-Host
          Write-Host "... ($($output.Count) lines total, exit code $exit)"
          if ($exit -ne 0) { throw "Staged executable failed with a stripped PATH (exit $exit)." }
