name: core-windows
on:
  pull_request:
    branches-ignore:
      - cqrrp-gpu-benchmarking
  workflow_dispatch:
  # Only main. A branch with an open pull request is already covered by the
  # pull_request event above, and firing on both ran every job twice per
  # commit -- same SHA, same result.
  push:
    branches:
      - main

# One run per ref at a time. Pushing a fix used to leave the superseded run
# going to completion. Superseding is only safe for pull requests: on main we
# want every commit validated, not just the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows:
    name: windows-msvc-mkl-ilp64-${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: serial
            openmp: false
          - label: openmp
            openmp: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: setup native Windows dependencies
        uses: ./.github/actions/setup-randlapack-deps-windows

      - name: build, install, and test RandLAPACK
        shell: pwsh
        run: |
          $openmp = '${{ matrix.openmp }}' -eq 'true'
          & "$env:GITHUB_WORKSPACE/.github/scripts/windows/run-ci.ps1" `
            -Task Core `
            -WorkRoot "$env:GITHUB_WORKSPACE/../RandLAPACK-windows-ci" `
            -OpenMP:$openmp
