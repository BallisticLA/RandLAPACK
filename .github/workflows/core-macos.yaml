name: core-macos
on:
  pull_request:
    branches-ignore:
      - cqrrp-gpu-benchmarking
  workflow_dispatch:
  # Only main. A branch with an open pull request is already covered by the
  # pull_request event above, and firing on both ran every job twice per
  # commit -- same SHA, same result.
  push:
    branches:
      - main

# One run per ref at a time. Pushing a fix used to leave the superseded run
# going to completion. Superseding is only safe for pull requests: on main we
# want every commit validated, not just the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dependency installs are cached and the RandBLAS submodule's own test suite
# is disabled; see core-linux.yaml for the reasoning.
#
# macOS builds use Apple's NEW Accelerate interface (LAPACK 3.12 on current
# SDKs) -- the legacy default is LAPACK 3.2.1 from 2009, with a broken
# divide-and-conquer gesdd and none of the routines BQRRP/HQRRP need. The
# defines.h check makes a silent fallback to the legacy interface a hard
# failure. Requires blaspp/lapackpp masters at or past icl-utk-edu/blaspp#134
# and icl-utk-edu/lapackpp#88 (both merged 2026-08-27). The cache key carries
# an "accelerate" tag because earlier caches hold dependencies built without
# -Dblas=accelerate.

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: submodule update
        run: |
          git submodule update --init --recursive

      - name: configure OS
        run: |
          # os level stuff
          pwd
          ls
          set -x
          brew install googletest

      - name: cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../blaspp-install
            ${{ github.workspace }}/../lapackpp-install
            ${{ github.workspace }}/../Random123-install
          key: core-deps-${{ runner.os }}-accelerate-v1

      - name: install BLAS++ (new Accelerate)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/icl-utk-edu/blaspp.git
          mkdir blaspp-build
          cd blaspp-build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`pwd`/../blaspp-install -Dblas=accelerate -Dgpu_backend=none -Dbuild_tests=OFF ../blaspp
          make -j$(sysctl -n hw.ncpu) install
          grep -q ACCELERATE_NEW_LAPACK ../blaspp-install/include/blas/defines.h \
            || { echo "::error::BLAS++ did not select Apple's new Accelerate interface"; exit 1; }

      - name: install Random123
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/DEShawResearch/Random123.git
          cd Random123/
          mkdir -p `pwd`/../Random123-install/include
          cp -rp include/Random123 `pwd`/../Random123-install/include/

      - name: install LAPACK++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/icl-utk-edu/lapackpp.git
          mkdir lapackpp-build
          cd lapackpp-build
          cmake -DCMAKE_BUILD_TYPE=Release \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../lapackpp-install \
              -Dbuild_tests=OFF \
              `pwd`/../lapackpp
          make -j$(sysctl -n hw.ncpu) install

      - name: build and test RandLAPACK (Release)
        run: |
          cd ..
          mkdir RandLAPACK-build
          cd RandLAPACK-build
          cmake -DCMAKE_BUILD_TYPE=Release \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -Dlapackpp_DIR=`pwd`/../lapackpp-install/lib/cmake/lapackpp \
              -DRandom123_DIR=`pwd`/../Random123-install/include/ \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../RandLAPACK-install \
              -DBUILD_TESTS=OFF \
              `pwd`/../RandLAPACK
          make -j$(sysctl -n hw.ncpu)
          make -j$(sysctl -n hw.ncpu) install
          ctest --output-on-failure

      - name: build and test extras
        run: |
          cd ..
          mkdir extras-build
          cd extras-build
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DRandLAPACK_DIR=`pwd`/../RandLAPACK-install/lib/cmake/RandLAPACK \
            -Dlapackpp_DIR=`pwd`/../lapackpp-install/lib/cmake/lapackpp \
            -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
            -DRandom123_DIR=`pwd`/../Random123-install/include/ \
            ../RandLAPACK/extras
          make -j$(sysctl -n hw.ncpu)
          ctest --output-on-failure

      - name: build benchmarks
        run: |
          cd ..
          mkdir benchmark-build
          cd benchmark-build
          cmake \
            -DRandLAPACK_DIR=`pwd`/../RandLAPACK-install/lib/cmake/RandLAPACK \
            ../RandLAPACK/benchmark
          make -j$(sysctl -n hw.ncpu)

  # Runs in parallel with the Release job instead of doubling its wall time.
  build-asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: submodule update
        run: |
          git submodule update --init --recursive

      - name: configure OS
        run: |
          set -x
          brew install googletest

      - name: cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../blaspp-install
            ${{ github.workspace }}/../lapackpp-install
            ${{ github.workspace }}/../Random123-install
          key: core-deps-${{ runner.os }}-accelerate-v1

      - name: install BLAS++ (new Accelerate)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/icl-utk-edu/blaspp.git
          mkdir blaspp-build
          cd blaspp-build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`pwd`/../blaspp-install -Dblas=accelerate -Dgpu_backend=none -Dbuild_tests=OFF ../blaspp
          make -j$(sysctl -n hw.ncpu) install
          grep -q ACCELERATE_NEW_LAPACK ../blaspp-install/include/blas/defines.h \
            || { echo "::error::BLAS++ did not select Apple's new Accelerate interface"; exit 1; }

      - name: install Random123
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/DEShawResearch/Random123.git
          cd Random123/
          mkdir -p `pwd`/../Random123-install/include
          cp -rp include/Random123 `pwd`/../Random123-install/include/

      - name: install LAPACK++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/icl-utk-edu/lapackpp.git
          mkdir lapackpp-build
          cd lapackpp-build
          cmake -DCMAKE_BUILD_TYPE=Release \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../lapackpp-install \
              -Dbuild_tests=OFF \
              `pwd`/../lapackpp
          make -j$(sysctl -n hw.ncpu) install

      - name: build and test RandLAPACK (Debug/asan)
        run: |
          cd ..
          mkdir RandLAPACK-build-asan
          cd RandLAPACK-build-asan
          cmake -DCMAKE_BUILD_TYPE=Debug \
              -DSANITIZE_ADDRESS=ON \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -Dlapackpp_DIR=`pwd`/../lapackpp-install/lib/cmake/lapackpp \
              -DRandom123_DIR=`pwd`/../Random123-install/include/ \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../RandLAPACK-install-asan \
              -DBUILD_TESTS=OFF \
              `pwd`/../RandLAPACK
          make -j$(sysctl -n hw.ncpu)
          make -j$(sysctl -n hw.ncpu) install
          ctest --output-on-failure
