name: core-macos
on:
  pull_request:
    branches-ignore:
      - cqrrp-gpu-benchmarking
  workflow_dispatch:
  push:
    branches-ignore:
      - cqrrp-gpu-benchmarking

# Dependency installs are cached and the RandBLAS submodule's own test suite
# is disabled; see core-linux.yaml for the reasoning.

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: submodule update
        run: |
          git submodule update --init --recursive

      - name: configure OS
        run: |
          # os level stuff
          pwd
          ls
          set -x
          brew install googletest

      - name: cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../blaspp-install
            ${{ github.workspace }}/../lapackpp-install
            ${{ github.workspace }}/../Random123-install
          key: core-deps-${{ runner.os }}-v1

      - name: install BLAS++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/icl-utk-edu/blaspp.git
          mkdir blaspp-build
          cd blaspp-build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`pwd`/../blaspp-install -Dbuild_tests=OFF ../blaspp
          make -j$(sysctl -n hw.ncpu) install

      - name: install Random123
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/DEShawResearch/Random123.git
          cd Random123/
          mkdir -p `pwd`/../Random123-install/include
          cp -rp include/Random123 `pwd`/../Random123-install/include/

      - name: install LAPACK++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/icl-utk-edu/lapackpp.git
          mkdir lapackpp-build
          cd lapackpp-build
          cmake -DCMAKE_BUILD_TYPE=Release \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../lapackpp-install \
              -Dbuild_tests=OFF \
              `pwd`/../lapackpp
          make -j$(sysctl -n hw.ncpu) install

      - name: build and test RandLAPACK (Release)
        run: |
          cd ..
          mkdir RandLAPACK-build
          cd RandLAPACK-build
          cmake -DCMAKE_BUILD_TYPE=Release \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -Dlapackpp_DIR=`pwd`/../lapackpp-install/lib/cmake/lapackpp \
              -DRandom123_DIR=`pwd`/../Random123-install/include/ \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../RandLAPACK-install \
              -DBUILD_TESTS=OFF \
              `pwd`/../RandLAPACK
          make -j$(sysctl -n hw.ncpu)
          make -j$(sysctl -n hw.ncpu) install
          ctest --exclude-regex "^TestABRIK\.ABRIK_catch_instability" --output-on-failure

      - name: build and test extras
        run: |
          cd ..
          mkdir extras-build
          cd extras-build
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DRandLAPACK_DIR=`pwd`/../RandLAPACK-install/lib/cmake/RandLAPACK \
            -Dlapackpp_DIR=`pwd`/../lapackpp-install/lib/cmake/lapackpp \
            -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
            -DRandom123_DIR=`pwd`/../Random123-install/include/ \
            ../RandLAPACK/extras
          make -j$(sysctl -n hw.ncpu)
          ctest --output-on-failure

      - name: build benchmarks
        run: |
          cd ..
          mkdir benchmark-build
          cd benchmark-build
          cmake \
            -DRandLAPACK_DIR=`pwd`/../RandLAPACK-install/lib/cmake/RandLAPACK \
            ../RandLAPACK/benchmark
          make -j$(sysctl -n hw.ncpu)

  # Runs in parallel with the Release job instead of doubling its wall time.
  build-asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: submodule update
        run: |
          git submodule update --init --recursive

      - name: configure OS
        run: |
          set -x
          brew install googletest

      - name: cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../blaspp-install
            ${{ github.workspace }}/../lapackpp-install
            ${{ github.workspace }}/../Random123-install
          key: core-deps-${{ runner.os }}-v1

      - name: install BLAS++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/icl-utk-edu/blaspp.git
          mkdir blaspp-build
          cd blaspp-build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`pwd`/../blaspp-install -Dbuild_tests=OFF ../blaspp
          make -j$(sysctl -n hw.ncpu) install

      - name: install Random123
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/DEShawResearch/Random123.git
          cd Random123/
          mkdir -p `pwd`/../Random123-install/include
          cp -rp include/Random123 `pwd`/../Random123-install/include/

      - name: install LAPACK++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/icl-utk-edu/lapackpp.git
          mkdir lapackpp-build
          cd lapackpp-build
          cmake -DCMAKE_BUILD_TYPE=Release \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../lapackpp-install \
              -Dbuild_tests=OFF \
              `pwd`/../lapackpp
          make -j$(sysctl -n hw.ncpu) install

      - name: build and test RandLAPACK (Debug/asan)
        run: |
          cd ..
          mkdir RandLAPACK-build-asan
          cd RandLAPACK-build-asan
          cmake -DCMAKE_BUILD_TYPE=Debug \
              -DSANITIZE_ADDRESS=ON \
              -Dblaspp_DIR=`pwd`/../blaspp-install/lib/cmake/blaspp \
              -Dlapackpp_DIR=`pwd`/../lapackpp-install/lib/cmake/lapackpp \
              -DRandom123_DIR=`pwd`/../Random123-install/include/ \
              -DCMAKE_INSTALL_PREFIX=`pwd`/../RandLAPACK-install-asan \
              -DBUILD_TESTS=OFF \
              `pwd`/../RandLAPACK
          make -j$(sysctl -n hw.ncpu)
          make -j$(sysctl -n hw.ncpu) install
          ctest --exclude-regex "^TestABRIK\.ABRIK_catch_instability" --output-on-failure
